# EmDash #2691 lab: note-desc. See docs/emdash-2691.md for the run procedure.
url: http://127.0.0.1:8791/query
parameters:
  orderBy: note
  direction: desc
response:
  items: $.items
  next_cursor: $.cursor
  has_more: $.hasMore
  id: $.id
ordering:
  - field: data.note
    direction: desc
    type: number
    nulls: first
  - field: id
    direction: desc
    type: string
limits: [10, 50, 100]
repeats: 1
max_pages: 60
max_items: 3000
max_response_bytes: 1000000
timeout: 10
oracle:
  command:
    - python3
    - ../oracle.py
    - --db
    - ${EMDASH_LAB_DB}
    - --fixture
    - ../fixture.json
    - --sort
    - note
    - --direction
    - desc
  format: lines
  ordered: true
  timeout: 20
