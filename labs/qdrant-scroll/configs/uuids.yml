url: http://127.0.0.1:16333/collections/cursorproof_uuids/points/scroll
method: POST
body:
  filter:
    must:
    - key: group
      match:
        value: keep
  with_payload:
  - group
  - rank
  with_vector: false
pagination:
  mode: token
  cursor_param: offset
  limit_param: limit
  terminal_values:
  - null
response:
  items: $.result.points
  next_cursor: $.result.next_page_offset
  id: $.id
ordering:
- field: id
  type: string
limits:
- 1
- 7
- 10
- 25
- 100
repeats: 1
max_pages: 1000
max_items: 10000
oracle:
  command:
  - python3
  - ../oracle.py
  - uuids
  format: json
  ordered: true
