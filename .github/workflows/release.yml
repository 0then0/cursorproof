name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release
        required: true
        type: string
      publish_to_pypi:
        description: Publish the selected tag to PyPI
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.18'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as project_file:
              version = tomllib.load(project_file)['project']['version']
          expected_tag = f'v{version}'
          actual_tag = os.environ['RELEASE_TAG']
          if actual_tag != expected_tag:
              raise SystemExit(f'Release tag {actual_tag!r} does not match {expected_tag!r}')
          PY
      - name: Build distributions
        run: uv build --out-dir dist
      - name: Verify wheel and source distribution
        run: |
          uv run python - <<'PY'
          import tomllib
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          distributions = list(Path('dist').iterdir())
          wheels = [path for path in distributions if path.name.endswith('.whl')]
          source_distributions = [path for path in distributions if path.name.endswith('.tar.gz')]
          if len(wheels) != 1 or len(source_distributions) != 1:
              raise SystemExit(f'Expected one wheel and one sdist, found: {distributions!r}')

          with Path('pyproject.toml').open('rb') as project_file:
              project = tomllib.load(project_file)['project']
          with ZipFile(wheels[0]) as wheel:
              metadata_paths = [
                  path for path in wheel.namelist()
                  if path.endswith('.dist-info/METADATA')
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(f'Expected one wheel METADATA file, found: {metadata_paths!r}')
              metadata = Parser().parsestr(wheel.read(metadata_paths[0]).decode('utf-8'))
          if metadata.get('Name') != project['name'] or metadata.get('Version') != project['version']:
              raise SystemExit(
                  'Wheel metadata does not match pyproject.toml: '
                  f'Name={metadata.get("Name")!r}, Version={metadata.get("Version")!r}'
              )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            for distribution in dist/*; do
              name="${distribution##*/}"
              if ! printf '%s\n' "$assets" | grep -Fxq -- "$name"; then
                gh release upload "$RELEASE_TAG" "$distribution"
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi

  pypi-publish:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/cursorproof/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
