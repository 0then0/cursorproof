[project]
name = "cursorproof"
version = "0.1.1"
description = "Check the correctness of cursor pagination across an entire REST stream."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
cursorproof = "cursorproof.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.uv.build-backend]
source-include = ["tests/**", "examples/**"]
